name: Cloud Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path ngrok.zip -DestinationPath ngrok -Force

      - name: Auth & Configure Ngrok
        run: |
          & .\ngrok\ngrok.exe authtoken 2hq6S3OFtWLImVyr15ERQC8BU95_3GKiQwzcqAkxpLK3m7cMt
          New-Item -ItemType Directory -Path "$env:USERPROFILE\.ngrok2" -Force | Out-Null
          $config = @"
          version: 2
          web_addr: 127.0.0.1:4040
          "@
          $config | Set-Content -Path "$env:USERPROFILE\.ngrok2\ngrok.yml" -Force
          Write-Host "Config written"

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1

      - name: Set User Password
        shell: cmd
        run: |
          net user runneradmin RDPaccess123! 2>nul
          net localgroup administrators runneradmin /add 2>nul
          exit 0

      - name: Start Ngrok Tunnel
        run: |
          Write-Host "Starting ngrok with logging..."
          $proc = Start-Process -FilePath ".\ngrok\ngrok.exe" `
            -ArgumentList "tcp","3389","--log=stdout","--log-format=logfmt","--web-addr=127.0.0.1:4040" `
            -NoNewWindow -PassThru
          Write-Host "ngrok PID: $($proc.Id)"
          Write-Host "Waiting 15s for ngrok to initialize..."
          Start-Sleep -Seconds 15
          $running = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if ($running) { Write-Host "ngrok is running" }
          else { Write-Host "WARNING: ngrok process NOT found! It may have crashed." }

      - name: Get Ngrok URL
        run: |
          Write-Host "Listing processes with 'ngrok'..."
          Get-Process | Where-Object { $_.Name -like "*ngrok*" } | Format-Table Name,Id
          Write-Host "Checking port 4040..."
          netstat -ano | findstr ":4040"
          $url = $null
          for ($i = 0; $i -lt 30; $i++) {
            Write-Host "Attempt $($i+1) of 30..."
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
              Write-Host "API response received!"
              $tunnels = $resp.tunnels
              Write-Host "Tunnels count: $($tunnels.Count)"
              foreach ($t in $tunnels) {
                Write-Host "  Tunnel: $($t.name) -> $($t.public_url)"
              }
              $url = $tunnels[0].public_url
              break
            } catch {
              Write-Host "Failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 5
          }
          if (-not $url) {
            Write-Host "=== All listening ports ==="
            netstat -ano | findstr "LISTENING"
            Write-Error "Could not get ngrok URL after 30 attempts"; exit 1
          }
          Write-Host "==========================================="
          Write-Host "  RDP Connection Details"
          Write-Host "==========================================="
          Write-Host "  Address : $url"
          Write-Host "  User    : runneradmin"
          Write-Host "  Password: RDPaccess123!"
          Write-Host "==========================================="

      - name: Keep Alive
        run: Start-Sleep -Seconds 21400
