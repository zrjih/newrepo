name: Cloud Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive ngrok.zip

      - name: Auth Ngrok
        run: .\ngrok\ngrok.exe authtoken 2hq6S3OFtWLImVyr15ERQC8BU95_3GKiQwzcqAkxpLK3m7cMt

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1

      - name: Set User Password
        shell: cmd
        run: |
          net user runneradmin RDPaccess123! 2>nul
          net localgroup administrators runneradmin /add 2>nul
          exit 0

      - name: Start Ngrok Tunnel
        run: |
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389","--webaddr=127.0.0.1","--webport=4040" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: Get Ngrok URL
        run: |
          $url = $null
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
              $url = $resp.tunnels[0].public_url
              break
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          if (-not $url) { Write-Error "Could not get ngrok URL"; exit 1 }
          Write-Host "==========================================="
          Write-Host "  RDP Connection Details"
          Write-Host "==========================================="
          Write-Host "  Address : $url"
          Write-Host "  User    : runneradmin"
          Write-Host "  Password: RDPaccess123!"
          Write-Host "==========================================="

      - name: Keep Alive
        run: Start-Sleep -Seconds 21400
