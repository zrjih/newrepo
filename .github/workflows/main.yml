name: Cloud Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive ngrok.zip

      - name: Auth Ngrok
        run: .\ngrok\ngrok.exe authtoken cr_2hq6S3OFtWLImVyr15ERQC8BU95

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1

      - name: Set User Password
        run: |
          net user runneradmin RDPaccess123! /add 2>$null
          net localgroup administrators runneradmin /add 2>$null

      - name: Start Ngrok Tunnel
        run: Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389","--webaddr=127.0.0.1","--webport=4040" -WindowStyle Hidden

      - name: Wait & Get Ngrok URL
        run: |
          Start-Sleep -Seconds 15
          $attempts = 0
          $publicUrl = $null
          while ($attempts -lt 10 -and -not $publicUrl) {
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
              $publicUrl = $resp.tunnels[0].public_url
            } catch {
              Start-Sleep -Seconds 5
            }
            $attempts++
          }
          if (-not $publicUrl) { Write-Error "Failed to get ngrok URL"; exit 1 }
          Write-Host "==========================================="
          Write-Host "RDP Connection Info:"
          Write-Host "Address : $publicUrl"
          Write-Host "User    : runneradmin"
          Write-Host "Password: RDPaccess123!"
          Write-Host "==========================================="
          Start-Sleep -Seconds 21600
